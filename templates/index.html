<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unggah Data | Regresi Linear</title>

    <!-- Bootstrap & Icon -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>

<body>

<main class="page">

    <section class="upload-card">

        <header class="text-center">
            <div class="icon-box">
                <i class="bi bi-graph-up-arrow"></i>
            </div>
            <h1>Analisis Regresi Linear</h1>
            <p class="subtitle">
                Unggah file CSV harga emas untuk pra-pemrosesan data,
                visualisasi, dan prediksi.
            </p>
        </header>

        <form action="{{ url_for('process_upload') }}" method="post" enctype="multipart/form-data">

            <input type="file" id="fileInput" name="file" accept=".csv" required hidden>

            <!-- Area unggah: klik atau seret file -->
            <label for="fileInput" id="dropZone" class="drop-zone">
                <i class="bi bi-cloud-arrow-up drop-icon"></i>
                <span class="drop-title" id="namaFile">Pilih atau seret file CSV ke sini</span>
                <span class="drop-hint" id="hintFile">Hanya file berformat .csv</span>
            </label>

            <button class="btn btn-primary w-100" type="submit">
                <i class="bi bi-play-circle me-2"></i>Proses Data
            </button>
        </form>

        <!-- Sumber data -->
        <div class="sumber">
            <p class="sumber-judul">Belum punya data?</p>
            <div class="sumber-list">
                <a href="https://www.investing.com/commodities/gold-historical-data"
                   target="_blank" rel="noopener noreferrer" class="sumber-item">
                    <i class="bi bi-graph-up"></i>
                    <span>
                        <strong>Investing.com</strong>
                        <small>Gold Historical Data</small>
                    </span>
                    <i class="bi bi-box-arrow-up-right ms-auto"></i>
                </a>

                <a href="https://drive.google.com/drive/folders/1Gi-bom1xavlqK_-ixnqcVhImqW5SSkWo?usp=drive_link"
                   target="_blank" rel="noopener noreferrer" class="sumber-item">
                    <i class="bi bi-google"></i>
                    <span>
                        <strong>Google Drive</strong>
                        <small>Dataset CSV</small>
                    </span>
                    <i class="bi bi-box-arrow-up-right ms-auto"></i>
                </a>
            </div>
        </div>

        <footer class="footer-text">
            Sistem Analisis Regresi Linear Sederhana<br>
            <span>Skripsi • Teknik Informatika</span>
        </footer>

    </section>

</main>

<script>
(function () {
    var input = document.getElementById('fileInput');
    var zone  = document.getElementById('dropZone');
    var nama  = document.getElementById('namaFile');
    var hint  = document.getElementById('hintFile');

    function tampilkan() {
        var f = input.files[0];
        if (f) {
            nama.textContent = f.name;
            hint.textContent = (f.size / 1024).toFixed(1) + ' KB • klik untuk mengganti';
            zone.classList.add('has-file');
        } else {
            nama.textContent = 'Pilih atau seret file CSV ke sini';
            hint.textContent = 'Hanya file berformat .csv';
            zone.classList.remove('has-file');
        }
    }

    input.addEventListener('change', tampilkan);

    ['dragenter', 'dragover'].forEach(function (ev) {
        zone.addEventListener(ev, function (e) {
            e.preventDefault();
            zone.classList.add('dragover');
        });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
        zone.addEventListener(ev, function (e) {
            e.preventDefault();
            zone.classList.remove('dragover');
        });
    });
    zone.addEventListener('drop', function (e) {
        var f = e.dataTransfer.files[0];
        if (f && f.name.toLowerCase().endsWith('.csv')) {
            input.files = e.dataTransfer.files;
            tampilkan();
        } else {
            hint.textContent = 'File harus berformat .csv';
        }
    });
})();
</script>

</body>
</html>
